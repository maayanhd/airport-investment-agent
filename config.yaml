# All tunable assumptions live here and are echoed to the user as "assumptions".
long_haul_min_miles: 1500
congestion_tie_gap: 0.005       # two delay rates closer than this (0.5 percentage points) are called equal
regions:                        # names the region ranking understands; a two-letter state code also works
  new england: [CT, MA, ME, NH, RI, VT]
strong_signal_scaled: 0.5       # a score component at or above this position in its fixed range counts as a strong signal
score_weights:                  # must sum to 1; every component is "higher = stronger expansion case"
  passenger_growth: 0.3         # passengers, last 12 months vs the 12 before
  load_factor: 0.3              # percent of seats filled, last 12 months
  delay_pressure: 0.2           # share of operated flights departing 15+ minutes late
  capacity_gap: 0.2             # passenger growth minus seat growth (demand outgrowing supply)
score_bounds:                   # [value scored 0, value scored 1]; clipped outside. Rounded 5th-95th percentile of
  passenger_growth: [-0.10, 0.10]   # the 97 covered airports on 2026-11 data (re-check after a refresh)
  load_factor: [50, 82]
  delay_pressure: [0.15, 0.30]
  capacity_gap: [-0.05, 0.05]
min_confidence: 0.6
max_plain_count: 10             # answer validator: plain integers 0..this ("top 3") need no source
year_range: [1990, 2099]        # answer validator: a number in this range after "in", "since"... is a year
snapshot_dir: data/snapshots
max_data_age_months: 6          # older data is flagged stale (BTS lags 2-4 months)
traffic_history_months: 30      # window requested; BTS lags 3-4 months, so 30 yields about 26
traffic_min_months: 24          # last 12 vs prior 12 needs 24 months per airport
delays_months: 12               # On-Time months requested (31 MB each, so only `data refresh delays` downloads)
delays_min_months: 9            # months an airport needs; BTS skips airports with no reporting carrier
min_airport_share: 0.9  # share of coverage that must have enough months, else keep the snapshot
max_name_candidates: 8   # a name matching more airports than this gets "be more specific" instead of a list
airport_aliases:                # metro areas and nicknames the airport data cannot know; the first code is the
  la: [LAX, BUR, LGB, ONT, SNA]  # default reading and the rest are offered. A city name like "Chicago" or
  los angeles: [LAX, BUR, LGB, ONT, SNA]  # "Santa Ana" needs no entry: it comes from the data.
  orange county: [SNA]
  new york: [JFK, LGA, EWR]
  nyc: [JFK, LGA, EWR]
  san francisco: [SFO, OAK, SJC]
  bay area: [SFO, OAK, SJC]
  washington: [DCA, IAD, BWI]
  dc: [DCA, IAD, BWI]
  dallas: [DFW, DAL]
router_model: claude-haiku-5-5  # the agent loop's model: picks the tools and writes the answer
judge_model: claude-sonnet-5-5
coverage_airports: [ATL, LAX, ORD, DFW, DEN, JFK, SFO, SEA, LAS, MCO, EWR, CLT, PHX, IAH, MIA, BOS, MSP, FLL, DTW, PHL, LGA, BWI, SLC, SAN, IAD, DCA, TPA, BNA, AUS, MDW, HNL, DAL, PDX, STL, RDU, HOU, SMF, MSY, SJC, OAK, SNA, SAT, MCI, CLE, IND, PIT, CMH, CVG, OGG, MKE, JAX, RSW, ONT, BUR, LGB, ABQ, OMA, BUF, ANC, FAI, JNU, BET, OTZ, KTN, SIT, CDV, ADQ, OME, PSP, TUS, RNO, BOI, TUL, OKC, MEM, SDF, RIC, ORF, CHS, SAV, GRR, ALB, ROC, SYR, PVD, MHT, PWM, BGR, BTV, ORH, BDL, HVN, HYA, ACK, MVY, PSM, LEB]
max_tool_rounds: 4              # agent loop: model turns that call tools before it must answer
remembered_airports: 8         # airports named in the follow-up hint about the last turn
fallback_max_lines: 40          # lines of raw tool figures shown when the wording cannot be verified
llm_max_tokens: 1024            # a reply longer than this is treated as cut off, never shown
llm_timeout_seconds: 30         # per model call
llm_retries: 1                  # the SDK retries rate limits and server errors this many times
session_ttl_minutes: 60         # an idle conversation is forgotten after this
max_sessions: 200               # past this the least recently used conversation is dropped
max_message_chars: 2000         # longest question the API accepts
history_turns: 6                # earlier turns kept so follow-ups like "and BOS?" can be resolved
validation_retries: 1           # rejected drafts the model may rewrite before the agent abstains
eval_thresholds:                # evals/run.py: a metric below its threshold fails the run
  routing_precision: 0.90       # share of tools the model called that the case expected
  routing_recall: 0.90          # share of expected tools the model called
  answered_rate: 0.90           # answerable questions that got a verified answer, not a fallback
  abstention: 1.00              # questions that must not be answered really are not
  disclosures: 1.00             # answers that state everything their case requires
  gold_match: 0.90              # answers that quote the headline figure of the tool result
